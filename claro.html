/* ================================================================
   CLARO — TRANSSAN PTY
   Extracto diurno: tela clara, tinta azul-marinho, vermelho só como
   marca de "agora". Tudo dentro de .dz-claro.
   ================================================================ */
.dz-claro{
  --cl-canvas:#F1F4F9;
  --cl-sheet:#FFFFFF;
  --cl-ink:#0A1C40;
  --cl-ink-2:#3B4A6B;
  --cl-ink-3:#5A6785;
  --cl-line:#E3E8F0;
  --cl-line-2:#CCD4E2;
  --cl-navy:#0B1F4A;
  --cl-navy-hi:#1B3A7A;
  --cl-on-navy-2:#B7C4E2;
  --cl-ghost:#A7B3CC;
  --cl-red:#E0242C;
  --cl-pos:#0A7650;
  --cl-pos-bg:#DDF2E8;
  --cl-neg:#AD4707;
  --cl-neg-bg:#FBEAD7;
  --cl-sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --cl-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  box-sizing:border-box;
  min-height:100%;
  padding-block:14px 44px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:#F1F4F9 linear-gradient(180deg,#FCFDFE 0px,#F1F4F9 380px) no-repeat;
  color:var(--cl-ink);
  font-family:var(--cl-sans);
  font-size:16px;
  font-weight:400;
  line-height:1.4;
  text-align:left;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overflow-x:clip;
}
.dz-claro div,.dz-claro span,.dz-claro p,.dz-claro h2,.dz-claro ul,.dz-claro ol,.dz-claro li,
.dz-claro button,.dz-claro svg,.dz-claro i,.dz-claro b,.dz-claro strong{box-sizing:border-box}
.dz-claro p,.dz-claro h2,.dz-claro ul,.dz-claro ol{margin:0;padding:0}
.dz-claro ul,.dz-claro ol{list-style:none}
.dz-claro i{font-style:normal}

.dz-claro .cl-col{max-width:520px;margin-left:auto;margin-right:auto;container-type:inline-size}

/* ---------- shared atoms ---------- */
.dz-claro .cl-lab{font-family:var(--cl-mono);font-size:10.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;line-height:1.2;color:var(--cl-ink-3)}
.dz-claro .cl-u{margin-left:.07em;font-size:.5em;font-weight:500;letter-spacing:0;color:var(--cl-ink-3)}
.dz-claro .cl-pre{margin-right:.03em;font-weight:400;color:var(--cl-ink-3)}
.dz-claro .cl-now{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--cl-red)}
.dz-claro .cl-tri{display:block;flex:none}
.dz-claro .cl-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:14.5px;font-weight:600;letter-spacing:-0.01em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}

.dz-claro .cl-pill.is-neg{background:var(--cl-neg-bg);color:var(--cl-neg)}
.dz-claro .cl-sheet{border-radius:24px;background:var(--cl-sheet);box-shadow:0 0 0 1px rgba(10,28,64,.07),0 1px 2px rgba(10,28,64,.04)}
.dz-claro .cl-cols{display:flex;justify-content:space-between;gap:12px;padding:20px 20px 2px}
.dz-claro .cl-cols.is-drv{padding-left:56px}

/* ---------- 1 · top bar ---------- */
.dz-claro .cl-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 2px}

.dz-claro .cl-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;margin-top:14px;padding:4px;border-radius:17px;background:var(--cl-sheet);box-shadow:0 0 0 1px rgba(10,28,64,.07),0 1px 2px rgba(10,28,64,.05)}
.dz-claro .cl-tab{-webkit-appearance:none;appearance:none;margin:0;padding:0;border:0;height:42px;border-radius:13px;background:transparent;color:var(--cl-ink-2);font-family:inherit;font-size:15px;font-weight:500;letter-spacing:-0.005em;line-height:1;cursor:default;-webkit-tap-highlight-color:transparent}

.dz-claro .cl-tab:focus-visible{outline:2px solid var(--cl-navy-hi);outline-offset:2px}

/* ---------- 2 · hero ---------- */
.dz-claro .cl-hero{margin-top:36px}
.dz-claro .cl-eyebrow{padding:0 2px;font-size:15.5px;font-weight:500;letter-spacing:-0.005em;line-height:1.3;color:var(--cl-ink)}

.dz-claro .cl-sep{letter-spacing:-0.02em;color:#8793AE}

.dz-claro .cl-vsline b{font-weight:600;white-space:nowrap;color:var(--cl-ink)}

.dz-claro .cl-heroCard{margin-top:28px;border-radius:28px;overflow:hidden;background:var(--cl-sheet);box-shadow:0 0 0 1px rgba(10,28,64,.06),0 2px 4px rgba(10,28,64,.04),0 26px 48px -26px rgba(10,28,64,.34)}

.dz-claro .cl-key{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.dz-claro .cl-key i{display:block;width:18px;height:3px;border-radius:2px;background:var(--cl-navy)}
.dz-claro .cl-key.is-ghost i{height:2px;background:var(--cl-ghost)}
.dz-claro .cl-key.is-proj i{height:2px;border-radius:0;background:repeating-linear-gradient(90deg,var(--cl-navy) 0 4px,rgba(11,31,74,0) 4px 7px)}

.dz-claro .cl-chart{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.dz-claro .cl-grid{stroke:var(--cl-line);stroke-width:1}
.dz-claro .cl-base{stroke:var(--cl-line-2);stroke-width:1}

.dz-claro .cl-drow-v{font-size:15.5px;font-weight:600;letter-spacing:-0.02em;line-height:1;white-space:nowrap;color:var(--cl-ink);font-variant-numeric:tabular-nums}
.dz-claro .cl-drow.is-old .cl-drow-n{font-weight:500;color:var(--cl-ink-2)}
.dz-claro .cl-drow.is-old .cl-drow-v{font-family:var(--cl-mono);font-size:12px;font-weight:500;letter-spacing:0;color:var(--cl-ink-3)}
.dz-claro .cl-drow[aria-selected="true"]{background:var(--cl-navy)}
.dz-claro .cl-drow[aria-selected="true"] .cl-drow-n,.dz-claro .cl-drow[aria-selected="true"] .cl-drow-v{color:#FFFFFF}
.dz-claro .cl-drow[aria-selected="true"] .cl-drow-m{color:var(--cl-on-navy-2)}
.dz-claro .cl-drow:focus-visible,.dz-claro .cl-dsel-btn:focus-visible{outline:2px solid var(--cl-navy-hi);outline-offset:2px}
@media (hover:hover){.dz-claro .cl-drow:not([aria-selected="true"]):hover{background:#F1F4F9}}
@media (prefers-reduced-motion:reduce){.dz-claro .cl-dsel-ic svg{transition:none}}

/* ---------- ecrã largo (PC) ---------- */
@media (min-width:1000px){
  .dz-claro .cl-dv{display:grid;grid-template-columns:288px minmax(0,1fr);column-gap:52px;align-items:start}
  .dz-claro .cl-dsel-btn{display:none}
  .dz-claro .cl-dlist{display:block;margin-top:0}
  .dz-claro .cl-dv .cl-who{margin-top:0}
  .dz-claro{padding-block:24px 72px;padding-left:max(32px, env(safe-area-inset-left, 0px));padding-right:max(32px, env(safe-area-inset-right, 0px))}
  .dz-claro .cl-col{max-width:1200px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:44px;align-items:center}
  .dz-claro .cl-top{display:contents}
  .dz-claro .cl-brand{grid-column:1;grid-row:1}
  .dz-claro .cl-logo{height:30px;max-width:none}
  .dz-claro .cl-tabs{grid-column:2;grid-row:1;justify-self:start;width:400px;margin-top:0}
  .dz-claro .cl-upd{grid-column:2;grid-row:1;justify-self:end}
  .dz-claro .cl-view,.dz-claro .cl-foot{grid-column:1 / -1;min-width:0}
  .dz-claro .cl-view[hidden]{display:none}

  .dz-claro #claro-view-mes{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);column-gap:52px;align-items:start}
  .dz-claro #claro-view-mes > .cl-hero{grid-column:1;grid-row:1;margin-top:48px}
  .dz-claro #claro-view-mes > :nth-child(2){grid-column:2;grid-row:1 / span 2;margin-top:48px}
  .dz-claro #claro-view-mes > :nth-child(3){grid-column:1;grid-row:2}
  .dz-claro #claro-view-mes > :nth-child(4){grid-column:1;grid-row:3}
  .dz-claro #claro-view-mes > :nth-child(5){grid-column:2;grid-row:3 / span 3}
  .dz-claro #claro-view-mes > :nth-child(6){grid-column:1;grid-row:4}
  .dz-claro #claro-view-mes > :nth-child(7){grid-column:1;grid-row:5}
  .dz-claro #claro-view-mes .cl-big{font-size:96px}
  .dz-claro .cl-heroCard{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
  .dz-claro .cl-ritmo{display:flex;flex-direction:column;justify-content:center;padding:26px 24px 30px}
  .dz-claro #claro-view-mes .cl-kpi-v{font-size:54px}

  .dz-claro #claro-dv-body{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);column-gap:44px;align-items:start}
  .dz-claro #claro-dv-body > *{grid-column:1}
  .dz-claro #claro-dv-body > :nth-child(5){grid-column:2;grid-row:1 / span 4;margin-top:0}
  .dz-claro .cl-who-name{font-size:52px}
  .dz-claro #claro-dv-body .cl-big{font-size:70px}
  .dz-claro #claro-dv-body .cl-kpi-v{font-size:40px}
  .dz-claro .cl-bars{height:190px}

  .dz-claro #claro-hs-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:60px;align-items:start}
  .dz-claro #claro-hs-body > :nth-child(1){grid-column:1;grid-row:1 / span 2}
  .dz-claro #claro-hs-body > :nth-child(2){grid-column:2;grid-row:1;margin-top:84px}
  .dz-claro #claro-hs-body > :nth-child(3){grid-column:2;grid-row:2}
  .dz-claro #claro-hs-body > :nth-child(4){grid-column:1;grid-row:3}
  .dz-claro #claro-hs-body > :nth-child(5){grid-column:2;grid-row:3}
  .dz-claro .cl-bars.is-years{height:300px}
  .dz-claro #claro-hs-body .cl-big.is-long{font-size:80px}
}

    <!-- vista · motoristas -->
    <div class="cl-view" id="claro-view-motoristas" role="tabpanel" hidden>
      <div class="cl-dv">
        <div class="cl-dv-side">
          <div class="cl-h"><h2 class="cl-h2">Motoristas</h2><span class="cl-keyNow">histórico de cada um</span></div>
          <button type="button" class="cl-dsel-btn" id="claro-dv-toggle" aria-expanded="false" aria-controls="claro-dv-list">
            <span><span class="cl-lab">Motorista</span><span class="cl-dsel-name" id="claro-dv-current"></span></span>
            <span class="cl-dsel-ic" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 4.2 6 8.2l4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <div class="cl-dlist" id="claro-dv-list" role="listbox" aria-label="Motorista"></div>
        </div>
        <div id="claro-dv-body"></div>
      </div>
    </div>

    <!-- vista · histórico -->
    <div class="cl-view" id="claro-view-historico" role="tabpanel" hidden>
      <div id="claro-hs-body"></div>
    </div>

    <!-- 9 · rodapé -->
    <p class="cl-foot" id="claro-foot"></p>

  </div>
</section>

<script>
(function () {
  'use strict';

  var root = document.querySelector('.dz-claro[data-design="claro"]');
  var TD = window.TD;
  if (!root || !TD) { return; }

  var SVG_NS = 'http://www.w3.org/2000/svg';

  /* ---------- helpers ---------- */
  function $(id) { return root.querySelector('#claro-' + id); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined && text !== null) { e.textContent = String(text); }
    return e;
  }

  function sv(tag, attrs) {
    var e = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) {
      if (Object.prototype.hasOwnProperty.call(attrs, k)) { e.setAttribute(k, attrs[k]); }
    }
    return e;
  }

  function fmtInt(n) {
    var v = Math.round(Number(n) || 0);
    var s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 ? '-' : '') + s;
  }

  function fmtDec2(n) {
    var parts = (Number(n) || 0).toFixed(2).split('.');
    return fmtInt(parts[0]) + '.' + parts[1];
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function plural(n, one, many) { return n === 1 ? one : many; }

  /* "7.63M" -> ["7.63","M"] · "263k MT" -> ["263","k MT"] · "R53k" -> ["R53","k"] */
  function splitUnit(str) {
    var m = /^([^\d]*[\d.,]*\d)\s*(.*)$/.exec(String(str));
    return m ? [m[1], m[2]] : [String(str), ''];
  }

  /* writes the figure with its unit set smaller; characters stay as given */
  function putFigure(node, str, splitCurrency) {
    var p = splitUnit(str);
    var num = p[0];
    node.textContent = '';
    if (num.charAt(0) === '~' || num.charAt(0) === '≈') {
      node.appendChild(el('span', 'cl-pre', num.charAt(0)));
      num = num.slice(1);
    }
    node.appendChild(document.createTextNode(num));
    if (!p[1]) { return; }
    var cur = splitCurrency ? /^(\S+)\s+(\S.*)$/.exec(p[1]) : null;
    if (cur) {
      node.appendChild(el('span', 'cl-u', cur[1]));
      node.appendChild(el('span', 'cl-u', cur[2]));
    } else {
      node.appendChild(el('span', 'cl-u', p[1]));
    }
  }

  function tri(up) {
    var s = sv('svg', { 'class': 'cl-tri', viewBox: '0 0 10 8', width: '9', height: '7.2', 'aria-hidden': 'true' });
    s.appendChild(sv('path', {
      d: up ? 'M5 1 9 7H1Z' : 'M5 7 1 1h8Z',
      fill: 'currentColor', stroke: 'currentColor', 'stroke-width': '1.2', 'stroke-linejoin': 'round'
    }));
    return s;
  }

  /* "▲ 10%" -> drawn arrow + "10%" (same reading, crisp glyph) */
  function putArrowText(node, str) {
    var s = String(str);
    var first = s.charAt(0);
    node.textContent = '';
    if (first === '▲' || first === '▼') {
      node.setAttribute('aria-label', s);
      node.appendChild(tri(first === '▲'));
      node.appendChild(document.createTextNode(s.slice(1).replace(/^\s+/, '')));
    } else {
      node.appendChild(document.createTextNode(s));
    }
  }

  function parseShort(str) {
    var m = /([\d.,]*\d)\s*([MmKk])?/.exec(String(str));
    if (!m) { return NaN; }
    var v = parseFloat(m[1].replace(/,/g, ''));
    var u = (m[2] || '').toLowerCase();
    return v * (u === 'm' ? 1e6 : u === 'k' ? 1e3 : 1);
  }

  function shortAxis(v) {
    if (v >= 1e6) {
      var a = v / 1e6;
      return (Math.abs(a - Math.round(a)) < 1e-9 ? String(Math.round(a)) : a.toFixed(1)) + 'M';
    }
    if (v >= 1e3) { return Math.round(v / 1e3) + 'k'; }
    return String(Math.round(v));
  }

  function niceStep(raw) {
    if (!(raw > 0)) { return 1; }
    var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var n = raw / p;
    var c = [1, 2, 2.5, 4, 5, 10];
    for (var i = 0; i < c.length; i++) {
      if (n <= c[i] + 1e-9) { return c[i] * p; }
    }
    return 10 * p;
  }

  function r2(n) { return Math.round(n * 100) / 100; }

  /* monotone cubic (Fritsch–Carlson): smooth, never overshoots a cumulative series */
  function monoPath(pts) {
    var n = pts.length;
    if (!n) { return ''; }
    var d = 'M' + r2(pts[0][0]) + ',' + r2(pts[0][1]);
    if (n === 1) { return d; }
    var s = [], m = [], i;
    for (i = 0; i < n - 1; i++) {
      s[i] = (pts[i + 1][1] - pts[i][1]) / ((pts[i + 1][0] - pts[i][0]) || 1);
    }
    m[0] = s[0];
    m[n - 1] = s[n - 2];
    for (i = 1; i < n - 1; i++) {
      if (s[i - 1] * s[i] <= 0) {
        m[i] = 0;
      } else {
        var h0 = pts[i][0] - pts[i - 1][0];
        var h1 = pts[i + 1][0] - pts[i][0];
        var p = (s[i - 1] * h1 + s[i] * h0) / (h0 + h1);
        m[i] = (s[i] < 0 ? -2 : 2) * Math.min(Math.abs(s[i - 1]), Math.abs(s[i]), 0.5 * Math.abs(p));
      }
    }
    for (i = 0; i < n - 1; i++) {
      var dx = (pts[i + 1][0] - pts[i][0]) / 3;
      d += 'C' + r2(pts[i][0] + dx) + ',' + r2(pts[i][1] + dx * m[i]) +
           ' ' + r2(pts[i + 1][0] - dx) + ',' + r2(pts[i + 1][1] - dx * m[i + 1]) +
           ' ' + r2(pts[i + 1][0]) + ',' + r2(pts[i + 1][1]);
    }
    return d;
  }

  function heading(node, main, rest, withDot) {
    if (!node) { return; }
    node.textContent = '';
    if (withDot) {
      var dot = el('i', 'cl-now');
      dot.setAttribute('aria-hidden', 'true');
      node.appendChild(dot);
    }
    node.appendChild(document.createTextNode(main));
    if (rest) {
      node.appendChild(document.createTextNode(' '));
      node.appendChild(el('span', '', rest));
    }
  }

  /* matrícula + nº do slip de pesagem de uma viagem */
  function docLine(t) {
    var doc = el('div', 'cl-doc');
    if (t.matricula) { doc.appendChild(el('span', 'cl-plate', t.matricula)); }
    if (t.slip) {
      var s = el('span', 'cl-slipno', 'Slip');
      s.appendChild(el('b', '', t.slip));
      doc.appendChild(s);
    }
    return doc;
  }

  function tripRow(first, second, t) {
    var li = el('li', 'cl-trip');
    var who = el('div', '');
    who.appendChild(el('span', 'cl-trip-name', first));
    who.appendChild(el('span', 'cl-trip-mina', second));
    li.appendChild(who);
    var tons = el('span', 'cl-trip-t', fmtDec2(t.tons));
    tons.appendChild(el('i', '', 't'));
    li.appendChild(tons);
    li.appendChild(el('span', 'cl-trip-ll', fmtInt(t.ll)));
    if (t.matricula || t.slip) { li.appendChild(docLine(t)); }
    return li;
  }

  var VIEWS = ['mes', 'motoristas', 'historico'];
  var MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var MES3 = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  var SAL = 12000;

  /* 153346149 -> "153.3M" · 75960378 -> "75.96M" · 9800 -> "10k" */
  function shortM(v) {
    var a = Math.abs(v), s = v < 0 ? '-' : '';
    if (a >= 1e8) { return s + (a / 1e6).toFixed(1) + 'M'; }
    if (a >= 1e6) { return s + (a / 1e6).toFixed(2) + 'M'; }
    if (a >= 1e3) { return s + Math.round(a / 1e3) + 'k'; }
    return s + String(Math.round(a));
  }

  function kpiCell(label, value) {
    var cell = el('div', 'cl-kpi');
    cell.appendChild(el('span', 'cl-kpi-l', label));
    var v = el('span', 'cl-kpi-v cl-fit');
    putFigure(v, value);
    cell.appendChild(v);
    return cell;
  }

  function bigFigure(value, long) {
    var big = el('div', 'cl-big cl-fit' + (long ? ' is-long' : ''));
    var num = el('span', '');
    fmtInt(value).split(',').forEach(function (part, i) {
      if (i) { num.appendChild(el('span', 'cl-sep', ',')); }
      num.appendChild(document.createTextNode(part));
    });
    big.appendChild(num);
    big.appendChild(el('span', 'cl-big-u', 'MT'));
    return big;
  }

  function pressBtn(cls, text, pressed, onClick) {
    var b = el('button', cls, text);
    b.type = 'button';
    b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    b.addEventListener('click', onClick);
    return b;
  }

  var hero = TD.hero || {};
  var mesNome = String(TD.mes || '').split(' ')[0];

  /* ---------- 1 · top bar ---------- */
  (function () {
    var parts = String(TD.empresa || 'TRANSSAN PTY').split(/\s+/);
    $('logo').alt = parts[0] || 'TRANSSAN';
    $('pty').textContent = parts.slice(1).join(' ') || 'PTY';
    $('atualizado').textContent = TD.atualizado || '';

    var tabs = $('tabs');
    (TD.tabs || []).forEach(function (name, i) {
      var b = el('button', 'cl-tab', name);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      b.id = 'claro-tab-' + VIEWS[i];
      b.addEventListener('click', function () { showView(VIEWS[i], true); });
      tabs.appendChild(b);
    });
  })();

  /* ---------- 2 · hero ---------- */
  (function () {
    var eb = $('eyebrow');
    eb.appendChild(document.createTextNode('Lucro líquido '));
    eb.appendChild(el('span', '', '· ' + (TD.mes || '')));

    var ll = $('ll');
    String(hero.ll || '').split(',').forEach(function (part, i) {
      if (i) { ll.appendChild(el('span', 'cl-sep', ',')); }
      ll.appendChild(document.createTextNode(part));
    });
    $('moeda').textContent = hero.moeda || 'MT';

    var delta = $('delta');
    delta.className = 'cl-pill ' + (hero.subida ? 'is-pos' : 'is-neg');
    putArrowText(delta, hero.delta || '');
    if (!hero.delta) { delta.style.display = 'none'; }

    var vs = $('vsline');
    vs.appendChild(document.createTextNode('vs '));
    vs.appendChild(el('b', '', hero.vsAnterior || ''));
    vs.appendChild(document.createTextNode(' em ' + (TD.mesAnterior || '') + ' (até dia ' + hero.ateDia + ')'));

    /* legend */
    var legend = $('legend');
    [[mesNome, ''], [TD.mesAnterior || '', ' is-ghost'], ['Projeção', ' is-proj']].forEach(function (k) {
      var item = el('span', 'cl-key' + k[1]);
      var sw = el('i');
      sw.setAttribute('aria-hidden', 'true');
      item.appendChild(sw);
      item.appendChild(document.createTextNode(k[0]));
      legend.appendChild(item);
    });

    /* ritmo */
    var dia = $('dia');
    dia.appendChild(document.createTextNode('dia '));
    dia.appendChild(el('b', '', hero.dia));
    dia.appendChild(document.createTextNode('/' + hero.diasNoMes));

    var days = $('days');
    var total = Number(hero.diasNoMes) || 30;
    days.style.setProperty('--cl-n', total);
    for (var d = 1; d <= total; d++) {
      days.appendChild(el('i', 'cl-day' + (d < hero.dia ? ' is-done' : d === hero.dia ? ' is-today' : '')));
    }

    var proj = $('proj');
    putFigure(proj, (hero.projecao || '') + ' ' + (hero.moeda || 'MT'), true);
    $('ritmo').textContent = hero.ritmo || '';
  })();

  /* ---------- chart: cumulative profit, drawn to scale ---------- */
  (function () {
    var svg = $('chart');
    var nov = (hero.acumuladoNovembro || []).map(Number);
    var out = (hero.acumuladoOutubro || []).map(Number);
    var W = 340, H = 236;
    var M = { l: 4, r: 10, t: 36, b: 30 };
    var monthDays = Number(hero.diasNoMes) || 30;
    var maxDay = Math.max(monthDays, out.length, nov.length, 1);

    var lastDay = nov.length;
    var lastVal = lastDay ? nov[lastDay - 1] : 0;
    var projVal = parseShort(hero.projecao);
    if (!isFinite(projVal) || projVal <= lastVal) {
      projVal = lastDay ? lastVal / lastDay * monthDays : 0;
    }

    /* the scale ends exactly at the highest value drawn, so the lines use the whole
       plot; gridlines sit on round values at or below it */
    var top = Math.max(projVal, lastVal, out.length ? Math.max.apply(null, out) : 0, 1);
    var step = niceStep(top / 4);

    var plotW = W - M.l - M.r, plotH = H - M.t - M.b, baseY = H - M.b;
    function x(day) { return M.l + plotW * day / maxDay; }
    function y(v) { return baseY - plotH * v / top; }

    svg.setAttribute('aria-label',
      'Lucro líquido acumulado por dia: ' + mesNome + ' contra ' + (TD.mesAnterior || '') +
      ', com projeção até ao fim do mês');

    var defs = sv('defs', {});
    var grad = sv('linearGradient', { id: 'claro-area-grad', x1: '0', y1: '0', x2: '0', y2: '1' });
    grad.appendChild(sv('stop', { offset: '0', 'stop-color': '#0B1F4A', 'stop-opacity': '0.28' }));
    grad.appendChild(sv('stop', { offset: '0.7', 'stop-color': '#0B1F4A', 'stop-opacity': '0.07' }));
    grad.appendChild(sv('stop', { offset: '1', 'stop-color': '#0B1F4A', 'stop-opacity': '0' }));
    defs.appendChild(grad);
    svg.appendChild(defs);

    /* quiet grid + y labels sitting on their line */
    var hasScale = top > 1;
    for (var k = 0; k * step <= top * (1 + 1e-9); k++) {
      if (k > 0 && !hasScale) { break; }
      var v = k * step;
      var gy = r2(y(v));
      svg.appendChild(sv('line', { 'class': k === 0 ? 'cl-base' : 'cl-grid', x1: M.l, x2: W - M.r, y1: gy, y2: gy }));
      if (k > 0) {
        var yl = sv('text', { 'class': 'cl-ax', x: M.l, y: r2(gy - 5) });
        yl.textContent = shortAxis(v);
        svg.appendChild(yl);
      }
    }

    /* x labels: day of month, today emphasised */
    var ticks = [1, 5, 10, 15, 20, 25, 30].filter(function (t) {
      return t <= maxDay && Math.abs(t - lastDay) > 2;
    });
    ticks.forEach(function (t) {
      var tx = sv('text', { 'class': 'cl-ax', x: r2(x(t)), y: H - 9, 'text-anchor': 'middle' });
      tx.textContent = String(t);
      svg.appendChild(tx);
    });

    function pointsOf(series) {
      var pts = [[x(0), y(0)]];
      for (var i = 0; i < series.length; i++) { pts.push([x(i + 1), y(series[i])]); }
      return pts;
    }

    /* last month — ghost */
    if (out.length) {
      svg.appendChild(sv('path', { 'class': 'cl-ghostLine', d: monoPath(pointsOf(out)) }));
    }

    if (lastDay) {
      var px = x(lastDay), py = y(lastVal);
      var line = monoPath(pointsOf(nov));
      var hasProj = lastDay < monthDays;
      var ex = x(monthDays), ey = y(projVal);

      /* projection — dashed, to month end */
      if (hasProj) {
        svg.appendChild(sv('line', { 'class': 'cl-projLine', x1: r2(px), y1: r2(py), x2: r2(ex), y2: r2(ey) }));
      }

      /* this month — area + line */
      svg.appendChild(sv('path', {
        'class': 'cl-area', fill: 'url(#claro-area-grad)',
        d: line + 'L' + r2(px) + ',' + r2(baseY) + 'L' + r2(x(0)) + ',' + r2(baseY) + 'Z'
      }));
      svg.appendChild(sv('line', { 'class': 'cl-guide', x1: r2(px), x2: r2(px), y1: r2(py + 9), y2: r2(baseY) }));
      svg.appendChild(sv('path', { 'class': 'cl-line', d: line }));

      /* projection end — hollow point + outlined tag (projected = outlined, real = solid).
         The tag is opaque and sits above the point, flush with the plot edge, so no
         gridline or ghost line can ever run through the figure. Its width is estimated
         from the string, never measured: the chart may be built while hidden. */
      if (hasProj) {
        var label = String(hero.projecao || shortAxis(projVal));
        var tw = Math.round(label.length * 6.8 + 16), th = 20;
        var tgx = Math.max(M.l, Math.min(ex - tw / 2, W - M.r - tw));
        var tgy = Math.max(2, ey - 9 - th);
        svg.appendChild(sv('circle', { 'class': 'cl-projEnd', cx: r2(ex), cy: r2(ey), r: 3.5 }));
        svg.appendChild(sv('rect', { 'class': 'cl-projTag', x: r2(tgx), y: r2(tgy), width: tw, height: th, rx: th / 2 }));
        var pt = sv('text', { 'class': 'cl-projTxt', x: r2(tgx + tw / 2), y: r2(tgy + th / 2 + 4.2), 'text-anchor': 'middle' });
        pt.textContent = label;
        svg.appendChild(pt);
      }

      /* today */
      svg.appendChild(sv('circle', { 'class': 'cl-halo', cx: r2(px), cy: r2(py), r: 12 }));
      svg.appendChild(sv('circle', { 'class': 'cl-dotRing', cx: r2(px), cy: r2(py), r: 7 }));
      svg.appendChild(sv('circle', { 'class': 'cl-dot', cx: r2(px), cy: r2(py), r: 4.5 }));
      var td = sv('text', { 'class': 'cl-ax is-today', x: r2(px), y: H - 9, 'text-anchor': 'middle' });
      td.textContent = String(hero.dia || lastDay);
      svg.appendChild(td);
    }
  })();

  /* ---------- 3 · hoje ---------- */
  (function () {
    var hoje = TD.hoje || {};
    heading($('hoje-h'), 'Hoje', '· ' + (hoje.data || ''), true);

    var sum = $('hoje-sum');
    [['Viagens', fmtInt(hoje.viagens)], ['Tons', fmtInt(hoje.tons)], ['LL · MT', fmtInt(hoje.ll)]].forEach(function (c) {
      var cell = el('div', 'cl-sum-c');
      cell.appendChild(el('span', 'cl-lab', c[0]));
      cell.appendChild(el('span', 'cl-sum-v', c[1]));
      sum.appendChild(cell);
    });

    var list = $('hoje-list');
    (hoje.lista || []).forEach(function (t) {
      list.appendChild(tripRow(t.motorista, t.mina, t));
    });
    if (!(hoje.lista || []).length) {
      var vazio = el('li', 'cl-trip');
      vazio.appendChild(el('span', 'cl-trip-mina', 'Ainda sem viagens hoje'));
      list.appendChild(vazio);
    }
  })();

  /* ---------- 4 · mês · resumo ---------- */
  (function () {
    var box = $('kpis');
    (TD.kpis || []).forEach(function (k) {
      var cell = el('div', 'cl-kpi');
      cell.appendChild(el('span', 'cl-kpi-l', k.rotulo));
      var v = el('span', 'cl-kpi-v');
      putFigure(v, k.valor);
      cell.appendChild(v);
      box.appendChild(cell);
    });
  })();

  /* ---------- 5 · vs mês anterior ---------- */
  (function () {
    var vs = TD.vsMesAnterior || {};
    heading($('vs-h'), 'VS', TD.mesAnterior || '', false);

    var selo = $('selo');
    var seloStr = String(vs.selo || '');
    selo.className = 'cl-pill ' + (seloStr.charAt(0) === '▼' || /^\s*[-−]/.test(seloStr) ? 'is-neg' : 'is-pos');
    putArrowText(selo, seloStr);
    if (!seloStr) { selo.style.display = 'none'; }

    var rows = $('vs-rows');
    (vs.linhas || []).forEach(function (l) {
      var row = el('div', 'cl-vs-row');
      var main = el('div', '');
      main.appendChild(el('span', 'cl-vs-l', l.rotulo));
      var fig = el('span', 'cl-vs-fig');
      var val = el('span', 'cl-vs-v');
      putFigure(val, l.valor);
      fig.appendChild(val);
      fig.appendChild(el('span', 'cl-vs-a', l.anterior));
      main.appendChild(fig);
      row.appendChild(main);
      var neg = /^\s*[-−▼]/.test(String(l.delta));
      row.appendChild(el('span', 'cl-pill ' + (neg ? 'is-neg' : 'is-pos'), l.delta));
      rows.appendChild(row);
    });

    $('vs-proj').textContent = vs.projecao || '';
  })();

  /* ---------- 6 · motoristas ---------- */
  (function () {
    var drivers = TD.motoristas || [];
    heading($('mot-h'), 'Motoristas', '· ' + drivers.length, false);

    var maxLL = drivers.reduce(function (a, d) { return Math.max(a, Number(d.ll) || 0); }, 0) || 1;
    var list = $('mot-list');

    drivers.forEach(function (d, idx) {
      var item = el('li', 'cl-drv-item');
      var li = el('button', 'cl-drv cl-drv-btn');
      li.type = 'button';
      li.id = 'claro-drv-' + idx;
      li.setAttribute('aria-expanded', 'false');
      li.setAttribute('aria-controls', 'claro-drvp-' + idx);
      li.appendChild(el('span', 'cl-drv-pos', pad2(Number(d.pos) || 0)));

      var main = el('div', '');
      var name = el('span', 'cl-drv-name', d.nome);
      if (d.comViagemHoje) {
        name.appendChild(document.createTextNode('\u2060'));
        var dot = el('i', 'cl-now');

  /* ---------- tabs ---------- */
  function showView(k, push) {
    if (VIEWS.indexOf(k) < 0) { k = VIEWS[0]; }
    VIEWS.forEach(function (v) {
      var panel = $('view-' + v), tab = $('tab-' + v);
      if (panel) { panel.hidden = v !== k; }
      if (tab) { tab.setAttribute('aria-selected', v === k ? 'true' : 'false'); }
    });
    if (k === 'motoristas' && !dv.key) {
      var ano = String((TD.hist || {}).anoAtual || '');
      var best = Object.keys(DRV.dados || {}).filter(function (x) { return DRV.dados[x].anos[ano]; })
        .sort(function (a, b) { return DRV.dados[b].anos[ano].ll - DRV.dados[a].anos[ano].ll; })[0] || DRV.ordem[0];
      if (best) { selectDriver(best); }
    }
    if (k === 'motoristas') { renderDrvList(); }
    if (k === 'historico') { renderHist(); }
    if (push) {
      try { if (location.hash !== '#' + k) { location.hash = k; } } catch (e) {}
      window.scrollTo(0, 0);
    }
    fitAll();
  }
  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (VIEWS.indexOf(h) >= 0) { showView(h, false); }
  });

  /* ---------- guard: big figures always fit their column ----------
     Real values fit as designed; this only steps a figure down if a much longer
     number ever arrives (or the fonts are still swapping). */
  var fitNodes = [$('big'), $('proj'), $('toll-total')].concat(
    Array.prototype.slice.call(root.querySelectorAll('.cl-sum-v, .cl-kpi-v, .cl-toll-v')));

  function fitOne(node) {
    if (!node) { return; }
    node.style.fontSize = '';
    var avail = node.clientWidth, need = node.scrollWidth;
    if (avail > 0 && need > avail + 0.5) {
      var fs = parseFloat(window.getComputedStyle(node).fontSize) || 40;
      node.style.fontSize = (Math.floor(fs * avail / need * 100) / 100) + 'px';
    }
  }
  function fitAll() {
    if (!fitNodes) { return; }
    for (var i = 0; i < fitNodes.length; i++) { fitOne(fitNodes[i]); }
    var dyn = root.querySelectorAll('.cl-fit');
    for (var j = 0; j < dyn.length; j++) { fitOne(dyn[j]); }
  }

  fitAll();
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(fitAll);
  }
  if ('ResizeObserver' in window) {
    var raf = 0;
    new ResizeObserver(function () {
      if (raf) { window.cancelAnimationFrame(raf); }
      raf = window.requestAnimationFrame(fitAll);
    }).observe($('col'));
  }

  var startView = (location.hash || '').replace('#', '');
  showView(VIEWS.indexOf(startView) >= 0 ? startView : 'mes', false);
})();
</script>

<script>
/* tocar em "Atualizado" recarrega a página sem cache */
(function () {
  var l = document.querySelector('.dz-claro .cl-upd-l');
  if (l) { l.textContent = l.textContent + ' \u21BB'; }
})();
document.addEventListener('click', function (e) {
  var t = e.target;
  while (t && t !== document) {
    if (t.classList && t.classList.contains('cl-upd')) { location.replace(location.pathname + '?v=' + Date.now() + location.hash); return; }
    t = t.parentNode;
  }
});
</script>
